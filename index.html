<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FutFantasy</title>

<style>
:root{
  --bg:#0D0D12;
  --card:#1A1A22;
  --green:#39FF88;
  --cyan:#00E5FF;
  --text:#fff;
  --muted:#9CA3AF;
  --red:#FF4C4C;
  --line:#2b2b36;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Poppins,Arial,sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.app{
  min-height:100vh;
}

.top{
  padding:18px 24px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:rgba(13,13,18,.95);
  z-index:5;
}

.brand{
  font-size:24px;
  font-weight:800;
}

.brand span{
  color:var(--green);
}

.user{
  color:var(--muted);
  font-size:14px;
}

.content{
  max-width:1200px;
  margin:auto;
  padding:24px;
}

.nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:24px;
}

.nav button,
.btn{
  background:var(--card);
  color:#fff;
  padding:11px 15px;
  border-radius:10px;
  border:1px solid var(--line);
}

.nav button.active,
.btn.primary{
  background:var(--green);
  color:#07120c;
  border-color:var(--green);
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:14px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:18px;
}

.metric{
  font-size:30px;
  font-weight:800;
  margin-top:8px;
}

.muted{
  color:var(--muted);
}

h1,
h2,
h3{
  margin-top:0;
}

.player-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:12px;
  margin-top:16px;
}

.player{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
}

.player.selected{
  border-color:var(--green);
  box-shadow:0 0 18px rgba(57,255,136,.12);
}

.avatar{
  width:54px;
  height:54px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#111118;
  border:1px solid var(--line);
  font-size:25px;
  margin-bottom:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:14px 0;
}

.input,
.select{
  background:#111118;
  border:1px solid var(--line);
  color:#fff;
  border-radius:10px;
  padding:11px;
}

.budget{
  position:sticky;
  top:75px;
  z-index:3;
  background:#111118;
  border:1px solid var(--green);
  padding:13px;
  border-radius:12px;
  margin-bottom:15px;
}

.bar{
  height:8px;
  background:#292933;
  border-radius:99px;
  overflow:hidden;
  margin-top:8px;
}

.bar>i{
  display:block;
  height:100%;
  background:var(--green);
}

.pill{
  display:inline-block;
  padding:4px 8px;
  border-radius:99px;
  background:#111118;
  color:var(--cyan);
  font-size:12px;
}

.danger{
  color:var(--red);
}

.good{
  color:var(--green);
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
}

th,
td{
  text-align:left;
  padding:13px;
  border-bottom:1px solid var(--line);
}

tr.me{
  background:rgba(57,255,136,.08);
}

.pitch{
  min-height:540px;
  border-radius:18px;
  border:2px solid #285c46;
  background:linear-gradient(#123b2b,#0d2b20);
  position:relative;
  overflow:hidden;
  padding:20px;
}

.pitch:before{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:50%;
  border-top:2px solid rgba(255,255,255,.25);
}

.pitch:after{
  content:"";
  position:absolute;
  left:30%;
  right:30%;
  top:39%;
  height:22%;
  border:2px solid rgba(255,255,255,.25);
}

.formation{
  position:relative;
  height:500px;
}

.slot{
  position:absolute;
  transform:translate(-50%,-50%);
  text-align:center;
}

.ball{
  width:48px;
  height:48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#0d1110;
  border:2px solid var(--green);
  box-shadow:0 0 15px rgba(57,255,136,.2);
  margin:auto;
}

.slot small{
  display:block;
  margin-top:5px;
  font-size:11px;
  max-width:90px;
}

.radar{
  width:360px;
  max-width:100%;
  height:300px;
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
}

.loginbox{
  width:min(430px,100%);
  background:var(--card);
  padding:30px;
  border-radius:20px;
  border:1px solid var(--line);
}

.loginbox .input{
  width:100%;
  margin:7px 0;
}

.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#1d2830;
  border:1px solid var(--cyan);
  padding:13px 16px;
  border-radius:10px;
  display:none;
  z-index:20;
}

.achievement{
  border-left:4px solid var(--green);
}

.small{
  font-size:13px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.empty{
  padding:40px;
  text-align:center;
  color:var(--muted);
}

.stat-bar{
  height:8px;
  background:#292933;
  border-radius:99px;
  overflow:hidden;
  margin:6px 0 12px;
}

.stat-bar i{
  display:block;
  height:100%;
  background:var(--cyan);
}

@media(max-width:650px){

  .content{
    padding:15px;
  }

  .top{
    padding:15px;
  }

  .metric{
    font-size:25px;
  }

  th,
  td{
    padding:9px;
    font-size:13px;
  }

  .pitch{
    min-height:500px;
  }
}
</style>
</head>

/* =========================================================

========================================================= */

const fake = [

['FC Titanes','Carlos',258],
['Los Halcones','Sofía',247],
['Real Norte','Diego',239],
['Atlético 24','Valentina',226],
['Dream XI','Mateo',214],
['Rayo FC','Camila',205]

];


/* =========================================================
   ESTADO DEL USUARIO
========================================================= */

let state =
JSON.parse(localStorage.getItem('futfantasy') || 'null')
||
{
 user:'',
 team:'',
 selected:[],
 captain:null,
 week:1,
 league:'',
 joined:false,
 changes:3,
 achievements:[]
};

let view='home';

let comp=[];


/* =========================================================
   FUNCIONES GENERALES
========================================================= */

function save(){

 localStorage.setItem(
  'futfantasy',
  JSON.stringify(state)
 );

}


function esc(s){

 return String(s).replace(
  /[&<>"']/g,
  c => ({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#039;'
  }[c])
 );

}


function toast(t){

 const x=document.getElementById('toast');

 x.textContent=t;

 x.style.display='block';

 setTimeout(()=>{
  x.style.display='none';
 },2200);

}


function points(p,w=state.week){

 return p.pts[w-1] || 0;

}


function price(){

 return state.selected.reduce(
  (s,id)=>{
   const p=players.find(p=>p.id===id);
   return s+p.price;
  },
  0
 );

}


function total(){

 let result=state.selected.reduce(
  (s,id)=>{
   const p=players.find(p=>p.id===id);
   return s+points(p);
  },
  0
 );

 if(state.captain){

  const captain=players.find(
   p=>p.id===state.captain
  );

  if(captain){

   result+=points(captain);

  }

 }

 return result;

}


function valid(){

 let c={
  POR:0,
  DEF:0,
  MED:0,
  DEL:0
 };

 state.selected.forEach(id=>{

  const p=players.find(
   x=>x.id===id
  );

  if(p){
   c[p.pos]++;
  }

 });

 return (
  c.POR===1 &&
  c.DEF===4 &&
  c.MED===4 &&
  c.DEL===2 &&
  price()<=100
 );

}


function rank(){

 const base=fake.map(
  x=>x[2]
 );

 return 1 + base.filter(
  x=>x>total()
 ).length;

}

  </button>

 `;

function shell(body){

 return `

 <div class="app">

  <header class="top">

   <div class="brand">
    Fut<span>Fantasy</span>
   </div>

   <div class="user">
    ${esc(state.user)}
    ·
    ${esc(state.team)}
   </div>

  </header>

  <main class="content">

   ${nav()}

   ${body}

  </main>

 </div>

 `;

}


/* =========================================================
   LOGIN
========================================================= */

function login(){

 document.getElementById('app').innerHTML=`

 <div class="login">

  <div class="loginbox">

   <h1>
    Fut<span style="color:var(--green)">
     Fantasy
    </span>
   </h1>

   <p class="muted">
    Crea tu equipo. Compite. Sube en el ranking.
   </p>

   <input
    id="user"
    class="input"
    placeholder="Nombre de usuario"
   >

   <input
    id="team"
    class="input"
    placeholder="Nombre del equipo"
   >

   <button
    class="btn primary"
    style="width:100%;margin-top:10px"
    onclick="enter()">
    Entrar
   </button>

  </div>

 </div>

 `;

}


function enter(){

 const u=document
  .getElementById('user')
  .value
  .trim();

 const t=document
  .getElementById('team')
  .value
  .trim();

 if(!u || !t){

  return toast(
   'Completa ambos campos'
  );

 }

 state.user=u;
 state.team=t;

 save();

 render();

}

function draft(){

 return shell(`

 <div class="budget">

  <div class="row">

   <b>
    Presupuesto:
    ${100-price()} M restantes
   </b>

   <span>
    ${price()}/100 M
   </span>

  </div>

  <div class="bar">

    style="width:${Math.min(price(),100)}%">
   </i>

  </div>

   Armar equipo
  </h1>

  <div class="controls">

   <input
    id="search"
    class="input"
    placeholder="Buscar jugador..."
    oninput="filterDraft()"
   >

   <select
    id="pos"
    class="select"
    onchange="filterDraft()">

    <option value="ALL">
     Todas las posiciones
    </option>

    <option value="POR">
     Porteros
    </option>

    <option value="DEF">
     Defensas
    </option>

    <option value="MED">
     Mediocampistas
    </option>

    <option value="DEL">
     Delanteros
    </option>

   </select>


   <select
    id="max"
    class="select"
    onchange="filterDraft()">

    <option value="100">
     Precio máximo
    </option>

    <option value="12">
     12 M
    </option>

    <option value="10">
     10 M
    </option>

    <option value="8">
     8 M
    </option>

   </select>

  </div>


  <div
   id="counts"
   class="muted small">

   POR 0/1 ·
   DEF 0/4 ·
   MED 0/4 ·
   DEL 0/2

  </div>


  <div
   id="players"
   class="player-grid">

   ${playerCards(players)}

  </div>


  <div
   class="actions"
   style="margin-top:18px">

   <button
    class="btn primary"
    onclick="saveTeam()">
    Guardar equipo
   </button>

   <button
    class="btn"
    onclick="go('compare')">
    Comparar jugadores
   </button>

  </div>

 </div>

 `);

}


function playerCards(list){

 return list.map(p=>{

  const sel=state.selected.includes(p.id);

  return `

  <div
   class="player ${sel?'selected':''}">

   <div class="avatar">
    ⚽
   </div>


   <div class="row">

    <b>
     ${esc(p.n)}
    </b>

    <span class="pill">
     ${p.pos}
    </span>

   </div>


   <p class="muted">
    ${p.price} M ·
    ${points(p)} pts
   </p>


   <p class="small">
    ⚡ ${p.pace}
    · 🎯 ${p.shoot}
    · 🎯P ${p.pass}
   </p>


   <button
    class="btn ${sel?'':'primary'}"
    onclick="togglePlayer(${p.id})">

    ${sel?'Quitar':'+'}

   </button>

  </div>

  `;

 }).join('')

 ||
 '<div class="empty">No hay jugadores.</div>';

}


function filterDraft(){

 const q=
  document
  .getElementById('search')
  .value
  .toLowerCase();

 const po=
  document
  .getElementById('pos')
  .value;

 const m=
  +document
  .getElementById('max')
  .value;


 document.getElementById('players')
 .innerHTML=

 playerCards(

  players.filter(p=>

   (!q ||
    p.n
    .toLowerCase()
    .includes(q)
   )

   &&

   (
    po==='ALL' ||
    p.pos===po
   )

   &&

   p.price<=m

  )

 );

 updateCounts();

}


function updateCounts(){

 let c={
  POR:0,
  DEF:0,
  MED:0,
  DEL:0
 };

 state.selected.forEach(id=>{

  const p=players.find(
   x=>x.id===id
  );

  if(p){
   c[p.pos]++;
  }

 });

 const el=
  document.getElementById('counts');

 if(el){

  el.textContent=
   `POR ${c.POR}/1 ·
    DEF ${c.DEF}/4 ·
    MED ${c.MED}/4 ·
    DEL ${c.DEL}/2`;

 }

}


/* =========================================================
   SELECCIÓN DE JUGADORES
========================================================= */

function togglePlayer(id){

 const p=
  players.find(x=>x.id===id);

 if(state.selected.includes(id)){

  state.selected=
   state.selected.filter(
    x=>x!==id
   );

  if(state.captain===id){

   state.captain=null;

  }

 }else{

  if(state.selected.length>=11){

   return toast(
    'Tu plantilla ya tiene 11 jugadores'
   );

  }

  if(price()+p.price>100){

   return toast(
    'No tienes presupuesto suficiente'
   );

  }

  const count=
   state.selected
   .map(x=>players.find(y=>y.id===x).pos)
   .filter(x=>x===p.pos)
   .length;

  const lim={
   POR:1,
   DEF:4,
   MED:4,
   DEL:2
  }[p.pos];

  if(count>=lim){

   return toast(

function compToggle(id){

  comp=

function drawRadar(){

 const c=
  document.getElementById('radar');

 if(!c || !comp.length){
  return;
 }

 const x=
  c.getContext('2d');

 const cx=180;
 const cy=150;
 const r=105;

 const labels=[
  'Ritmo',
  'Tiro',
  'Pase',
  'Defensa',
  'Físico'
 ];

 x.clearRect(
  0,
  0,
  360,
  300
 );

 x.strokeStyle='#555';

 x.fillStyle='#9CA3AF';

 x.font='12px Arial';


 for(let ring=1;ring<=3;ring++){

  x.beginPath();

  for(let i=0;i<5;i++){

   let a=
    -Math.PI/2+
    i*2*Math.PI/5;

   let rr=
    r*ring/3;

   x.lineTo(
    cx+Math.cos(a)*rr,
    cy+Math.sin(a)*rr
   );

  }

  x.closePath();

  x.stroke();

 }


 for(let i=0;i<5;i++){

  let a=
   -Math.PI/2+
   i*2*Math.PI/5;

  x.beginPath();

  x.moveTo(
   cx,
   cy
  );

  x.lineTo(
   cx+Math.cos(a)*r,
   cy+Math.sin(a)*r
  );

  x.stroke();

  x.fillText(
   labels[i],
   cx+Math.cos(a)*(r+20)-15,
   cy+Math.sin(a)*(r+20)
  );

 }


 comp.forEach((id,idx)=>{

  const p=
   players.find(
    q=>q.id===id
   );

  const vals=[
   p.pace,
   p.shoot,
   p.pass,
   p.def,
   p.phys
  ];

  x.beginPath();

  vals.forEach((v,i)=>{

   let a=
    -Math.PI/2+
    i*2*Math.PI/5;

   let rr=
    r*v/100;

   if(i){

    x.lineTo(
     cx+Math.cos(a)*rr,
     cy+Math.sin(a)*rr
    );

   }else{

    x.moveTo(
     cx+Math.cos(a)*rr,
     cy+Math.sin(a)*rr
    );

   }

  });

  x.closePath();

  x.strokeStyle=
   idx
   ? '#00E5FF'
   : '#39FF88';

  x.stroke();

 });

}

/* =========================================================
   CAMBIO DE JUGADOR
========================================================= */

function changePlayer(){

 if(!state.changes){

  return toast(
   'No tienes cambios disponibles'
  );

 }


 if(!valid()){

  return toast(
   'Primero completa tu equipo'
  );

 }


 let out=
  state.selected[0];

 let p=
  players.find(
   x=>x.id===out
  );


 let replacement=
  players.find(

   x=>
    x.pos===p.pos &&
    !state.selected.includes(x.id) &&
    price()-p.price+x.price<=100

 );


 if(!replacement){

  return toast(
   'No hay reemplazo válido'
  );

 }


 state.selected=
  state.selected.filter(
   x=>x!==out
  );


 state.selected.push(
  replacement.id
 );


 state.changes--;


 if(state.captain===out){

  state.captain=null;

 }


 save();

 checkAchievements();

 toast(
  `${p.n} fue cambiado por ${replacement.n}`
 );

 render();

}

function checkAchievements(){

 const a=
  state.achievements;


 if(
  valid() &&
  !a.includes('starter')
 ){

  a.push('starter');

 }


 if(
  state.captain &&
  !a.includes('captain')
 ){

  a.push('captain');

 }


 if(
  state.changes<3 &&
  !a.includes('strategist')
 ){

  a.push('strategist');

 }


 if(
  total()>40 &&
  !a.includes('scorer')
 ){

  a.push('scorer');

 }


 if(
  state.league &&
  !a.includes('social')
 ){

  a.push('social');

 }


 save();

}
